<section class="s-hero tone-white" data-section="hero" data-art="image" id="hero" aria-labelledby="hero-title">
  <div class="s-hero__frame">
    <div class="s-hero__nav">
      <!-- @partial nav -->
    </div>
    <!-- Supplied blue-wave artwork fills the hero behind its copy and product preview. -->
    <div class="s-hero__art" aria-hidden="true">
      <div class="s-hero__sky" data-sky>
        <picture>
          <source media="(min-width: 1933px)" srcset="assets/art/hero-large.png" />
          <img src="assets/art/hero-waves.png" width="1672" height="941" alt="" fetchpriority="high" decoding="async" />
        </picture>
      </div>
      <div class="s-hero__grain"></div>
    </div>

    <div class="container s-hero__copy">
      <div class="s-hero__heading">
        <h1 id="hero-title" class="s-hero__title"><span class="s-hero__line">Одно приложение для</span> <span class="s-hero__line">записей, клиентов и кассы</span></h1>
        <p class="lead s-hero__lead"><span class="s-hero__intro">CRM для салонов, клиник, автосервисов, студий и других сервисных компаний.</span></p>
      </div>
      <div class="s-hero__actions">
        <a class="btn btn--dark btn--lg" href="#start">Начать работу<svg class="i i--nudge" aria-hidden="true"><use href="assets/icons.svg#arrow-right" /></svg></a>
        <a class="btn btn--glass btn--lg" href="#problems">Как это работает</a>
      </div>
    </div>

    <div class="s-hero__stage" data-stage>
      <!-- cloud shadows drifting over the sea and the glass; a pre-rendered texture moved by CSS -->
      <div class="s-hero__drift" aria-hidden="true"></div>

      <!-- The working CRM prototype (navcrm-prototype, built into landing/app by its build:embed
           script) runs in both devices: every tab, sheet and form responds, as in the product. -->
      <div class="s-hero__comp ui" data-comp>
        <div class="s-hero__win" data-win data-lens data-lens-bezel="26" data-lens-scale="60" data-lens-blur="18">
          <div class="s-hero__screen">
            <iframe class="s-hero__app" src="app/embed.html?v=1.5-home-lock#/" title="NavCRM: демо на компьютере, можно нажимать" loading="eager"></iframe>
          </div>
        </div>

        <!--
        ARCHIVED 2026-10-26: Hero Instagram booking notification.
        Removed from the visible hero at the owner's request; the original markup is
        preserved below, rather than deleted, so this component can be reviewed/restored.

        This was an aria-hidden, scripted illustration of Sitora Rakhimova booking a
        haircut with Malika at 12:00. A translucent card floated over the schedule's
        right edge (above the Telegram card); on phones it preceded the owner's phone.
        hero.js revealed it using data-note, then highlighted the 12:00 appointment
        and updated the phone's next appointment. It did not receive real bookings.

        Its styling remains in landing/css/sections/hero.css, marked ARCHIVED.
        Optional animation hooks remain in landing/js/sections/hero.js and tolerate
        its absence. To restore, move only the original div below outside this
        comment. The mobile layout detects the restored card and reserves its space.

        Original markup:
        <div class="s-hero__note" data-note aria-hidden="true">
          <span class="s-hero__glyph"><svg class="i"><use href="assets/icons.svg#instagram" /></svg></span>
          <div class="s-hero__note-body">
            <p class="s-hero__note-top"><b>Новая запись</b><span>только что</span></p>
            <p class="s-hero__note-name">Ситора Рахимова</p>
            <p class="s-hero__note-text">Стрижка и укладка у Малики, сегодня в 12:00</p>
          </div>
        </div>
        -->

        <!--
        ARCHIVED 2026-10-26: Hero Telegram reminder and confirmation demo.
        Removed from the visible hero at the owner's request; original markup follows.

        This aria-hidden glass card sat below the booking notification on desktop
        and was hidden on tablets/phones. It showed Gulnor Beauty's reminder for a
        manicure with Zarina, then hero.js moved a simulated tap onto "Confirm" and
        replaced the decorative buttons with a green confirmation message. These
        were illustration states, not real Telegram messages or working controls.

        Styling remains in landing/css/sections/hero.css, marked ARCHIVED; optional
        timing/state hooks remain in landing/js/sections/hero.js. To restore, move
        the original div below outside this comment and restore the archived
        data-tap span near the end of this composition. Keep the data attributes.

        Original markup:
        <div class="s-hero__tg" data-tg aria-hidden="true">
          <div class="s-hero__tg-head">
            <span class="ui-tile ui-tile--telegram s-hero__tg-tile"><img src="assets/logos/telegram.svg" alt=""></span>
            <span><b>Gulnor Beauty</b><small>Telegram</small></span>
          </div>
          <p class="ui-bubble ui-bubble--in s-hero__tg-msg">Напоминаем: завтра в 10:00 у вас маникюр с гелем у Зарины. Рудаки, 54.</p>
          <div class="ui-swap s-hero__tg-swap">
            <p class="s-hero__tg-done" data-done><svg class="i i--bold"><use href="assets/icons.svg#check" /></svg>Запись подтверждена. До завтра!</p>
            <div class="ui-chat-keys s-hero__tg-keys" data-keys data-hidden="true"><span class="ui-btn" data-confirm>Подтвердить</span><span class="ui-btn">Перенести</span></div>
          </div>
        </div>
        -->

        <div class="s-hero__phone ui-phone ui-phone--lifted" data-phone>
          <div class="ui-phone__screen">
            <img class="ui-phone__status" src="assets/device/status-bar.svg" width="725" height="102" alt="" />
            <div class="s-hero__screen">
              <iframe class="s-hero__app" src="app/embed.html?v=1.5-home-lock#/" title="NavCRM: демо на телефоне, можно нажимать" loading="eager"></iframe>
            </div>
            <!-- touch screens: the page keeps scrolling past the phone until it is tapped -->
            <button class="s-hero__try" type="button" data-try><span>Нажмите, чтобы попробовать</span></button>
          </div>
        </div>

        <!-- ARCHIVED 2026-10-26: Simulated pointer used only by the Telegram card
             archived above. Restore together with that card to replay its tap.
        <span class="tap" data-tap></span>
        -->
      </div>

      <!-- the cloud sea in front of the product during the entrance: the window rises out of it -->
      <div class="s-hero__mist" aria-hidden="true"></div>
    </div>
  </div>
</section>
